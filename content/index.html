            /* ============================================================
               展开卡片动画
               ============================================================ */
            function openExpand(id, thumbEl) {
                const member = getMemberById(id);
                if (!member) return;

                if (isExpanded && currentMemberId === id) { closeExpand(); return; }

                // 打断进行中的动画：取消旧动画，并以卡片当前实时位置作为新起点
                const wasAnimating = expandAnimating;
                if (wasAnimating) {
                    clearTimeout(animTimer);
                    animSeq++;
                }

                const seq = ++animSeq;
                const switching = isExpanded;
                currentMemberId = id;
                expandAnimating = true;
                fillExpandCard(member);

                // 若卡片已完全展开（show），直接在原位交换内容，避免向“上一个元素”偏移；
                // 否则从被点击卡片自身的缩略图位置展开，保证动画归属于当前点击的卡片。
                const alreadyOpen = expandCard.classList.contains('show');
                const liveRect = {
                    left: parseFloat(getComputedStyle(expandCard).left),
                    top: parseFloat(getComputedStyle(expandCard).top),
                    width: parseFloat(getComputedStyle(expandCard).width),
                    height: parseFloat(getComputedStyle(expandCard).height)
                };
                const start = alreadyOpen ? liveRect : toFixedRect(thumbEl.getBoundingClientRect());
                const padTop = getCollapsedPadTop(thumbEl, start);

                expandCard.style.transition = 'none';
                expandContent.style.transition = 'none';
                if (!alreadyOpen) expandCard.classList.remove('show');
                expandCard.style.setProperty('--pad-top', padTop + 'px');
                setCardRect(start);
                // 强制回流：终止上一次动画的计算，以当前实时位置作为新基准提交，
                // 避免新动画一开始先跳向上一次动画的目标位置
                expandCard.getBoundingClientRect();
                expandCard.style.overflow = 'hidden';
                expandCard.style.pointerEvents = 'none';
                expandCard.style.visibility = 'visible';

                if (expandCard._thumbEl && expandCard._thumbEl !== thumbEl && document.contains(expandCard._thumbEl)) {
                    expandCard._thumbEl.classList.remove('expanded');
                }
                thumbEl.classList.add('expanded');
                overlay.classList.add('active');
                if (!switching) lockScroll();

                expandCard.style.transition = '';
                expandContent.style.transition = '';

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        if (seq !== animSeq) return;
                        setCardRect(computeTargetRect());
                        if (!alreadyOpen) expandCard.classList.add('show');
                    });
                });

                isExpanded = true;
                expandCard._thumbEl = thumbEl;
                expandCard._thumbRect = { left: start.left, top: start.top, width: start.width, height: start.height };

                clearTimeout(animTimer);
                animTimer = setTimeout(() => {
                    if (seq !== animSeq) return;
                    expandCard.style.pointerEvents = 'auto';
                    expandCard.style.overflow = '';
                    expandAnimating = false;
                }, ANIM_WAIT);
            }

            function closeExpand(onDone) {
                if (!isExpanded && !expandAnimating) { if (typeof onDone === 'function') onDone(); return; }
                if (expandAnimating) {
                    clearTimeout(animTimer);
                    animSeq++;
                }
                const seq = ++animSeq;
                expandAnimating = true;

                let targetThumb = expandCard._thumbEl;
                if (!targetThumb || !document.contains(targetThumb)) {
                    targetThumb = document.querySelector('.card-thumb[data-id="' + currentMemberId + '"]');
                }
                let targetRect, padTop = 26;
                if (targetThumb && document.contains(targetThumb)) {
                    const r = targetThumb.getBoundingClientRect();
                    targetRect = toFixedRect(r);
                    padTop = getCollapsedPadTop(targetThumb, r);
                } else {
                    targetRect = expandCard._thumbRect || computeTargetRect();
                }

                // 以卡片当前实时位置定格作为新基准，强制终止上一次动画的计算
                const start = toFixedRect(expandCard.getBoundingClientRect());
                expandCard.style.transition = 'none';
                expandContent.style.transition = 'none';
                expandCard.style.setProperty('--pad-top', padTop + 'px');
                expandCard.classList.remove('show');
                expandCard.style.pointerEvents = 'none';
                expandCard.style.overflow = 'hidden';
                setCardRect(start);
                expandCard.getBoundingClientRect();
                overlay.classList.remove('active');
                expandCard.style.transition = '';
                expandContent.style.transition = '';

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        if (seq !== animSeq) return;
                        setCardRect(targetRect);
                    });
                });

                clearTimeout(animTimer);
                animTimer = setTimeout(() => {
                    if (seq !== animSeq) return;
                    unlockScroll();
                    isExpanded = false;
                    currentMemberId = null;
                    if (targetThumb && document.contains(targetThumb)) {
                        targetThumb.classList.remove('expanded');
                    }
                    expandCard.style.visibility = 'hidden';
                    expandCard.style.pointerEvents = '';
                    expandCard.style.overflow = '';
                    expandCard._thumbEl = null;
                    expandAnimating = false;
                    if (typeof onDone === 'function') onDone();
                }, ANIM_WAIT);
            }

            function forceCollapse() {
                animSeq++;
                clearTimeout(animTimer);
                overlay.classList.remove('active');
                if (expandCard._thumbEl && document.contains(expandCard._thumbEl)) {
                    expandCard._thumbEl.classList.remove('expanded');
                }
                expandCard.classList.remove('show');
                expandCard.style.visibility = 'hidden';
                expandCard.style.pointerEvents = '';
                expandCard.style.overflow = '';
                expandCard._thumbEl = null;
                if (isExpanded) unlockScroll();
                isExpanded = false;
                currentMemberId = null;
                expandAnimating = false;
            }

            function scheduleReposition() {
                if (!isExpanded || expandAnimating) return;
                clearTimeout(viewportTimer);
                viewportTimer = setTimeout(() => {
                    if (!isExpanded || expandAnimating) return;
                    setCardRect(computeTargetRect());
                }, 150);

            window.addEventListener('orientationchange', scheduleReposition);

            function ensureTurnstileScript() {
                return new Promise((resolve, reject) => {
                    if (window.turnstile && window.turnstile.render) return resolve();
                    const existing = document.getElementById('cf-turnstile-script');
                    if (existing) {
                        existing.addEventListener('load', () => resolve());
                        existing.addEventListener('error', () => reject(new Error('人机验证脚本加载失败')));
                        return;
                    }
                    const s = document.createElement('script');
                    s.id = 'cf-turnstile-script';
                    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
                    s.async = true;
                    s.defer = true;
                    s.onload = () => resolve();
                    s.onerror = () => reject(new Error('人机验证脚本加载失败'));
                    document.head.appendChild(s);
                });
            }

            /* ============================================================
               自定义日期选择器（替代原生 input[type=date]）
               原生日历浮层位置不可控，这里用固定在输入框下方的自绘日历
               ============================================================ */
            const DATE_WEEK = ['日', '一', '二', '三', '四', '五', '六'];
            const datePicker = { anchor: null, view: null, selected: null };

            function pad2(n) { return String(n).padStart(2, '0'); }
            function fmtDate(y, m, d) { return y + '-' + pad2(m) + '-' + pad2(d); }
            function parseDateStr(s) {
                const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || '').trim());
                if (!m) return null;
                const y = +m[1], mo = +m[2], d = +m[3];
                const dt = new Date(Date.UTC(y, mo - 1, d));
                if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
                return { y, m: mo, d };
            }

            function openDatePicker(inputEl, anchorEl) {
                const cur = parseDateStr(inputEl.value);
                const now = new Date();
                datePicker.anchor = inputEl;
                datePicker.selected = cur;
                datePicker.view = cur ? { y: cur.y, m: cur.m } : { y: now.getFullYear(), m: now.getMonth() + 1 };
                datePopoverEl.hidden = false;
                renderDatePicker();
                positionDatePicker(anchorEl || inputEl);
            }

            function closeDatePicker() {
                datePopoverEl.hidden = true;
                datePicker.anchor = null;
            }

            function positionDatePicker(anchor) {
                const r = anchor.getBoundingClientRect();
                const pw = datePopoverEl.offsetWidth || 268;
                const ph = datePopoverEl.offsetHeight || 300;
                const vw = window.innerWidth, vh = window.innerHeight;
                let left = r.left;
                let top = r.bottom + 6;
                if (left + pw > vw - 8) left = Math.max(8, r.right - pw);
                if (top + ph > vh - 8) top = Math.max(8, r.top - ph - 6);
                datePopoverEl.style.left = left + 'px';
                datePopoverEl.style.top = top + 'px';
            }

            function renderDatePicker() {
                const y = datePicker.view.y, m = datePicker.view.m;
                const startDow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
                const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
                const total = Math.ceil((startDow + daysInMonth) / 7) * 7;
                const now = new Date();
                const todayStr = fmtDate(now.getFullYear(), now.getMonth() + 1, now.getDate());
                const selStr = datePicker.selected
                    ? fmtDate(datePicker.selected.y, datePicker.selected.m, datePicker.selected.d) : '';

                let cells = '';
                for (let i = 0; i < total; i++) {
                    const dt = new Date(Date.UTC(y, m - 1, 1 - startDow + i));
                    const cy = dt.getUTCFullYear(), cm = dt.getUTCMonth() + 1, cd = dt.getUTCDate();
                    const ds = fmtDate(cy, cm, cd);
                    const cls = 'date-cell'
                        + (cm !== m ? ' other' : '')
                        + (ds === todayStr ? ' today' : '')
                        + (ds === selStr ? ' selected' : '');
                    cells += '<button type="button" class="' + cls + '" data-dp="pick" data-date="' + ds + '">' + cd + '</button>';
                }

                datePopoverEl.innerHTML =
                    '<div class="date-pop-head">' +
                        '<button type="button" class="date-pop-nav" data-dp="prev-year" aria-label="上一年">«</button>' +
                        '<button type="button" class="date-pop-nav" data-dp="prev" aria-label="上个月">‹</button>' +
                        '<span class="date-pop-title">' + y + ' 年 ' + m + ' 月</span>' +
                        '<button type="button" class="date-pop-nav" data-dp="next" aria-label="下个月">›</button>' +
                        '<button type="button" class="date-pop-nav" data-dp="next-year" aria-label="下一年">»</button>' +
                    '</div>' +
                    '<div class="date-pop-grid">' +
                        DATE_WEEK.map(w => '<span class="dow">' + w + '</span>').join('') +
                        cells +
                    '</div>' +
                    '<div class="date-pop-foot">' +
                        '<button type="button" data-dp="clear">清 除</button>' +
                        '<button type="button" data-dp="today">今 天</button>' +
                    '</div>';
            }

            function shiftDateMonth(delta) {
                let m = datePicker.view.m + delta;
                let y = datePicker.view.y;
                y += Math.floor((m - 1) / 12);
                m = ((m - 1) % 12 + 12) % 12 + 1;
                datePicker.view = { y, m };
                renderDatePicker();
            }

            function applyPickedDate(str) {
                if (datePicker.anchor) datePicker.anchor.value = str;
                datePicker.selected = parseDateStr(str);
                closeDatePicker();
            }

            datePopoverEl.addEventListener('click', function (e) {
                const btn = e.target.closest('[data-dp]');
                if (!btn) return;
                const act = btn.dataset.dp;
                if (act === 'prev') shiftDateMonth(-1);
                else if (act === 'next') shiftDateMonth(1);
                else if (act === 'prev-year') shiftDateMonth(-12);
                else if (act === 'next-year') shiftDateMonth(12);
                else if (act === 'pick') applyPickedDate(btn.dataset.date);
                else if (act === 'clear') applyPickedDate('');
                else if (act === 'today') {
                    const n = new Date();
                    applyPickedDate(fmtDate(n.getFullYear(), n.getMonth() + 1, n.getDate()));
                }
            });

            function repositionDatePicker() {
                if (datePopoverEl.hidden || !datePicker.anchor) return;
                positionDatePicker(datePicker.anchor.closest('.date-field') || datePicker.anchor);
            }
            window.addEventListener('resize', repositionDatePicker);
            window.addEventListener('scroll', repositionDatePicker, true);

            document.addEventListener('mousedown', function (e) {
                if (datePopoverEl.hidden) return;
                if (datePopoverEl.contains(e.target)) return;
                if (e.target.closest && e.target.closest('.date-field')) return;
                closeDatePicker();
            });

            document.addEventListener('click', function (e) {
                const btn = e.target.closest && e.target.closest('[data-date-open]');
                if (!btn) return;
                e.preventDefault();
                const input = $(btn.dataset.dateOpen);
                if (!input) return;
                if (!datePopoverEl.hidden && datePicker.anchor === input) { closeDatePicker(); return; }
                openDatePicker(input, btn.closest('.date-field') || input);
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && !datePopoverEl.hidden) {
                    closeDatePicker();
                    e.stopImmediatePropagation();
                }
            });

            [efCrashDate, mfCrashDate].forEach(function (input) {
                input.addEventListener('focus', function () {
                    if (datePopoverEl.hidden || datePicker.anchor !== input) {
                        openDatePicker(input, input.closest('.date-field') || input);
                    }
                });
                input.addEventListener('input', function () {
                    let v = this.value.replace(/[^\d-]/g, '');
                    if (/^\d{8}$/.test(v)) v = v.slice(0, 4) + '-' + v.slice(4, 6) + '-' + v.slice(6);
                    this.value = v.slice(0, 10);
                });
            });

            function buildEditChanges() {

                        name: vals.name,
                        crashDate: vals.crashDate,
                        bio: vals.bio,
                        avatar: vals.avatar,
                        tags: vals.tags
                    };
                }
                const o = editCtx.original || {};
                const changes = {};
                if (vals.username !== (o.username || '')) changes.username = vals.username;
                if (vals.name !== (o.name || '')) changes.name = vals.name;
                if (vals.crashDate !== (o.crashDate || '')) changes.crashDate = vals.crashDate;
                if (vals.bio.trim() !== (o.bio || '')) changes.bio = vals.bio;
                if (vals.avatar !== (o.avatar || '')) changes.avatar = vals.avatar;
                if (vals.tags.join('\u0001') !== (o.tags || []).join('\u0001')) changes.tags = vals.tags;
                return changes;

            /* ============================================================
               路由
               ============================================================ */
            function showView(el) {
                if (el._hideTimer) { clearTimeout(el._hideTimer); el._hideTimer = null; }
                if (el._hideFinish) { el.removeEventListener('transitionend', el._hideFinish); el._hideFinish = null; }
                if (!el.hidden && !el.classList.contains('view-leave')) return;
                el.hidden = false;
                el.classList.add('view-enter');
                el.classList.remove('view-leave');
                void el.offsetWidth;
                el.classList.remove('view-enter');
            }

            function hideView(el, onDone) {
                if (el.hidden) { if (onDone) onDone(); return; }
                el.classList.add('view-leave');
                el.classList.remove('view-enter');
                let done = false;
                const finish = function () {
                    if (done) return; done = true;
                    if (el._hideTimer) { clearTimeout(el._hideTimer); el._hideTimer = null; }
                    el.hidden = true;
                    el.classList.remove('view-leave');
                    el.removeEventListener('transitionend', el._hideFinish);
                    el._hideFinish = null;
                    if (onDone) onDone();
                };
                const onEnd = function (e) {
                    if (e.target === el && e.propertyName === 'opacity') finish();
                };
                el._hideFinish = onEnd;
                el.addEventListener('transitionend', onEnd);
                el._hideTimer = setTimeout(finish, 260);
            }

            function route() {
                const isAdmin = location.hash === '#/admin' || location.hash === '#admin';
                const show = isAdmin ? viewAdmin : viewMain;
                const hide = isAdmin ? viewMain : viewAdmin;
                forceCollapse();
                closeEditModal();
                closeMemberModal();
                hideView(hide, function () { showView(show); });
                if (isAdmin) {
                    renderAdmin();
                } else if (mainNeedsReload) {
                    mainNeedsReload = false;
                    loadMembers();
                }
            }

            /* --- 后台列表统一事件委托 --- */
            adminListEl.addEventListener('click', async function (e) {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                const action = btn.dataset.action;

                /* 建议审核 */
                if (action === 'show-reject' || action === 'cancel-reject' || action === 'approve' || action === 'reject') {
                    const card = btn.closest('[data-sub-id]');
                    if (!card) return;
                    const id = Number(card.dataset.subId);

                    if (action === 'show-reject') {
                        const box = card.querySelector('.rej-box');
                        if (box) { box.hidden = false; box.querySelector('.rej-input').focus(); }
                    } else if (action === 'cancel-reject') {
                        const box = card.querySelector('.rej-box');
                        if (box) box.hidden = true;
                    } else if (action === 'approve') {
                        btn.disabled = true;
                        try {
                            await apiFetch('/admin/submissions/' + id + '/approve', { method: 'POST', token: adminToken });
                            toast('已通过，条目已更新', 'success');
                            mainNeedsReload = true;
                            loadAdminList();
                        } catch (err) {
                            btn.disabled = false;
                            if (isAuthErr(err)) { adminLogout(true); toast(err.message, 'error'); return; }
                            toast(err.message, 'error');
                        }
                    } else if (action === 'reject') {
                        const input = card.querySelector('.rej-input');
                        const reason = input ? input.value.trim() : '';
                        if (!reason) { toast('请填写驳回理由', 'error'); return; }
                        btn.disabled = true;
                        try {
                            await apiFetch('/admin/submissions/' + id + '/reject', {
                                method: 'POST',
                                body: { reason },
                                token: adminToken
                            });
                            toast('已驳回', 'success');
                            loadAdminList();
                        } catch (err) {
                            btn.disabled = false;
                            if (isAuthErr(err)) { adminLogout(true); toast(err.message, 'error'); return; }
                            toast(err.message, 'error');
                        }
                    }
                    return;
                }

                /* 条目管理 */
                if (action === 'm-add') {
                    openMemberModal('add');
                } else if (action === 'm-edit') {
                    const id = Number(btn.dataset.id);
                    const m = adminMembersCache.find(x => x.id === id);
                    if (m) openMemberModal('edit', m);
                } else if (action === 'm-del') {
                    const card = btn.closest('[data-member-id]');
                    const box = card && card.querySelector('.ma-del-box');
                    if (box) box.hidden = false;
                } else if (action === 'm-del-cancel') {
                    const card = btn.closest('[data-member-id]');
                    const box = card && card.querySelector('.ma-del-box');
                    if (box) box.hidden = true;
                } else if (action === 'm-del-confirm') {
                    btn.disabled = true;
                    await handleMemberDelete(Number(btn.dataset.id));
                    return;
                }

                /* 审核员管理 */
                if (action === 'r-add') {
                    await handleReviewerAdd();
                } else if (action === 'r-edit') {
                    const card = btn.closest('[data-reviewer-id]');
                    const box = card && card.querySelector('.reviewer-form');
                    if (box) box.hidden = false;
                } else if (action === 'r-cancel') {
                    const card = btn.closest('[data-reviewer-id]');
                    const box = card && card.querySelector('.reviewer-form');
                    if (box) box.hidden = true;
                } else if (action === 'r-save') {
                    const card = btn.closest('[data-reviewer-id]');
                    if (card) await handleReviewerSave(Number(card.dataset.reviewerId), card);
                } else if (action === 'r-del') {
                    const card = btn.closest('[data-reviewer-id]');
                    const box = card && card.querySelector('.reviewer-del-box');
                    if (box) box.hidden = false;
                } else if (action === 'r-del-cancel') {
                    const card = btn.closest('[data-reviewer-id]');
                    const box = card && card.querySelector('.reviewer-del-box');
                    if (box) box.hidden = true;
                } else if (action === 'r-del-confirm') {
                    const card = btn.closest('[data-reviewer-id]');
                    btn.disabled = true;
                    if (card) await handleReviewerDelete(Number(card.dataset.reviewerId));
                }

               主题切换
               ============================================================ */
            const themeSwitchEls = document.querySelectorAll('.theme-switch');
            const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
            const THEME_KEY = 'themeMode';

            function getThemeMode() {
                try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; }
            }

            function applyTheme(mode) {
                const isDark = mode === 'dark' || (mode === 'auto' && themeMedia.matches);
                document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
                document.documentElement.dataset.themeMode = mode;
                themeSwitchEls.forEach(el => {
                    el.querySelectorAll('button').forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.themeMode === mode);
                    });
                });
            }

            themeSwitchEls.forEach(el => {
                el.addEventListener('click', function (e) {
                    const btn = e.target.closest('[data-theme-mode]');
                    if (!btn) return;
                    const mode = btn.dataset.themeMode;
                    try { localStorage.setItem(THEME_KEY, mode); } catch (err) { /* 忽略 */ }
                    applyTheme(mode);
                });
            });

            if (themeMedia.addEventListener) {
                themeMedia.addEventListener('change', function () {
                    if (getThemeMode() === 'auto') applyTheme('auto');
                });
            } else if (themeMedia.addListener) {
                themeMedia.addListener(function () {
                    if (getThemeMode() === 'auto') applyTheme('auto');
                });
            }

            applyTheme(getThemeMode());

            /* ============================================================
               初始化
               ============================================================ */
            async function loadConfig() {
                try {
                    appConfig = await apiFetch('/config');
                } catch (e) {
                    appConfig = { turnstileEnabled: false, turnstileSiteKey: '' };
                }
                if (location.hash === '#/admin' || location.hash === '#admin') mountAdminTurnstile();
            }

            window.addEventListener('hashchange', route);
            loadConfig();
            route();
            loadMembers();

            window.__members = () => members;
        })();
    </script>
</body>

</html>
